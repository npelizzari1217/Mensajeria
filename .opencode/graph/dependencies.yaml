# =============================================================================
# Knowledge Graph — Inter-Module Dependencies
# =============================================================================
# Maps dependency direction. Arrow points FROM dependent TO dependency.
# Architecture rule: domain NEVER depends on application or infrastructure.

dependencies:
  # ── Domain has ZERO outward dependencies ────────────────────────────
  - from: domain-shared
    to: []
    rule: "Shared kernel: self-contained"

  - from: domain-auth
    to: [domain-shared]
    rule: "Auth domain uses shared value objects"

  - from: domain-messaging
    to: [domain-shared]
    rule: "Messaging domain uses shared value objects"

  # ── Application depends on domain only ──────────────────────────────
  - from: app-auth
    to: [domain-auth, domain-shared]
    rule: "Auth use cases orchestrate domain entities"

  - from: app-messaging
    to: [domain-messaging, domain-shared, domain-auth]
    rule: "Messaging use cases use messaging + auth domains"

  - from: app-groups
    to: [domain-messaging, domain-shared]
    rule: "Group use cases use group domain"

  - from: app-drafts
    to: [domain-messaging, domain-shared]
    rule: "Draft use cases use draft domain"

  # ── Infrastructure implements domain ports ──────────────────────────
  - from: infra-persistence
    to: [domain-auth, domain-messaging, domain-shared]
    rule: "Prisma repos implement domain repository interfaces"

  - from: infra-auth
    to: [domain-auth, app-auth, domain-shared]
    rule: "JWT/bcrypt implement auth ports"

  # ── Presentation wires everything ───────────────────────────────────
  - from: pres-auth
    to: [app-auth, infra-auth]
    rule: "Controllers delegate to use cases"

  - from: pres-messaging
    to: [app-messaging, infra-persistence]
    rule: "Controllers + gateway delegate to use cases"

# =============================================================================
# Architecture Violation Rules (checked by architecture-guardian)
# =============================================================================
violation_rules:
  - rule: domain_no_infra_deps
    description: "Domain layer must not import from infrastructure or presentation"
    check: "No import from 'api/src/infrastructure' or 'api/src/presentation' in packages/domain"
    severity: critical

  - rule: app_no_infra_imports
    description: "Application layer must not import from infrastructure directly (use ports)"
    check: "No import from 'api/src/infrastructure' in api/src/application (except @Inject decorators)"
    severity: critical

  - rule: no_circular
    description: "No circular dependencies between modules"
    check: "Graph analysis: no cycles in dependency graph"
    severity: critical

  - rule: domain_no_framework
    description: "Domain package must not depend on NestJS, Prisma, or any framework"
    check: "packages/domain/package.json has zero runtime dependencies"
    severity: critical
