name: gates

# Filtro de rutas: la unica job de este workflow (install + gate:coverage + lint + test +
# build) corre entera para cualquier cambio que toque codigo o configuracion de build. Las
# dos listas de abajo (push y pull_request) tienen que ser IDENTICAS a mano: GitHub no
# soporta anchors de YAML en `on:` en runners viejos y no podemos correr el workflow para
# confirmar version, asi que no usamos ese atajo. Si tocas una lista, toca la otra.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gates.yml' # el propio gate: un cambio en la compuerta tiene que ejercitarla
      - 'api/**'
      - 'web/**'
      - 'mobile/**'
      - 'packages/**'
      - '**/package.json' # scripts/check-gate-coverage.mjs escanea TODOS los workspaces via `pnpm -r list`; un package.json nuevo (o uno que pierda lint/test) tiene que activar el chequeo aunque su carpeta no matchee arriba
      - 'pnpm-lock.yaml' # resolucion de dependencias: afecta install + build de los 5 workspaces
      - 'pnpm-workspace.yaml' # cambia que directorios son workspaces, es decir que escanea gate:coverage
      - 'turbo.json' # pipeline de build/test/lint (dependsOn, outputs)
      - 'tsconfig.base.json' # tsconfig compartido que extienden api/web/mobile/packages/domain; afecta `tsc --noEmit` en todos
      - '.nvmrc' # version de Node para actions/setup-node; un bump puede romper build o test
  pull_request:
    paths:
      - '.github/workflows/gates.yml'
      - 'api/**'
      - 'web/**'
      - 'mobile/**'
      - 'packages/**'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - '.nvmrc'

# Cancela corridas viejas de la misma rama: solo importa la ultima.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Primero la completitud: si un workspace no esta cubierto, el verde de
      # las compuertas de abajo no significa nada. Ver scripts/check-gate-coverage.mjs.
      - name: Cobertura de las compuertas
        run: pnpm gate:coverage

      # Las tres compuertas de calidad, en el orden que fija
      # proyectos/CLAUDE.md seccion 4: lint, tipos y tests.
      # Aca `pnpm lint` es `tsc --noEmit`: no hay ESLint ni Biome en este repo.
      - name: Lint y tipos
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
