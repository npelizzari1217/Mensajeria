# =============================================================================
# Mensajeria — Nginx config para subdirectorio /mensajeria/
# =============================================================================
# Uso (en el mismo server block donde vive sesitec.net):
#
#   1. Copiá los bloques de abajo DENTRO de tu server block existente de sesitec.net
#   2. Cambiar /var/www/mensajeria/dist por la ruta real donde subiste el dist/
#   3. Verificar: sudo nginx -t && sudo systemctl reload nginx
#
# Si sesitec.net no tiene server block todavía, usá el bloque completo del final.
# =============================================================================

# -----------------------------------------------------------------------------
# GZIP — pegar dentro del bloque http {} en nginx.conf principal si no está
# -----------------------------------------------------------------------------
# gzip on;
# gzip_vary on;
# gzip_proxied any;
# gzip_comp_level 6;
# gzip_types text/plain text/css text/javascript application/javascript
#            application/json image/svg+xml font/woff font/woff2;

# -----------------------------------------------------------------------------
# Archivos estáticos — la app en /mensajeria/
# Vite genera los assets con el prefijo /mensajeria/ (base: '/mensajeria/')
# -----------------------------------------------------------------------------
location /mensajeria/ {
    alias /var/www/mensajeria/dist/;   # <-- CAMBIAR por tu ruta real

    # SPA fallback: cualquier ruta desconocida → index.html
    try_files $uri $uri/ /mensajeria/index.html;

    # index.html nunca se cachea; los assets sí (están hasheados por Vite)
    location ~* /mensajeria/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /mensajeria/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

# -----------------------------------------------------------------------------
# API Proxy — /v1/ → NestJS en puerto 3000
# Si el backend está en otro servidor, cambiá localhost:3000 por su URL.
# -----------------------------------------------------------------------------
location /v1/ {
    proxy_pass         http://localhost:3000;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    add_header Cache-Control "no-store";
}

# -----------------------------------------------------------------------------
# WebSocket Proxy — /socket.io/ → NestJS en puerto 3000
# Los headers Upgrade y Connection son OBLIGATORIOS para el handshake WS.
# -----------------------------------------------------------------------------
location /socket.io/ {
    proxy_pass         http://localhost:3000;
    proxy_http_version 1.1;

    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 60s;
}

